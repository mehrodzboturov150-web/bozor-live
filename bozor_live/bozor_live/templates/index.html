<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bozor.tj — объявления</title><style>
:root{--blue:#2563eb;--ink:#17243b;--muted:#718096;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,Arial}header{background:#fff;box-shadow:0 1px 8px #16243a12;position:sticky;top:0;z-index:2}.wrap{max-width:1150px;margin:auto;padding:16px}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:26px;font-weight:850;color:var(--blue);cursor:pointer;margin-right:auto}.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:650;cursor:pointer}.btn.alt{background:#eaf0ff;color:#2357be}.btn.danger{background:#fee2e2;color:#b91c1c}.search{display:flex;gap:10px;margin:24px 0}.search input{flex:1}.input,input,select,textarea{font:inherit;border:1px solid #d9e1ec;border-radius:10px;padding:12px;background:#fff;min-width:0}input:focus,textarea:focus{outline:2px solid #bfdbfe}main{min-height:85vh}.filters{display:flex;gap:8px;overflow:auto;padding:5px 0 18px}.chip{border:1px solid #dbe3ef;background:white;border-radius:30px;padding:9px 13px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--blue);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #14213b0a;cursor:pointer}.photo{height:175px;background:#e9eef8;display:flex;align-items:center;justify-content:center;font-size:65px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{font-size:20px;font-weight:800}.muted{color:var(--muted)}.item h3{font-size:15px;margin:7px 0;min-height:38px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.heart{border:0;background:none;font-size:23px;cursor:pointer;color:#e11d48}.modal-bg{position:fixed;inset:0;background:#09152a99;display:flex;align-items:center;justify-content:center;z-index:5;padding:14px}.modal{background:#fff;border-radius:18px;width:min(570px,100%);max-height:92vh;overflow:auto;padding:24px;position:relative}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:26px;cursor:pointer}.modal form{display:grid;gap:10px}.modal form input,.modal form select,.modal form textarea{width:100%}.modal textarea{min-height:90px}.bigphoto{width:100%;max-height:320px;object-fit:contain;background:#edf2f9;border-radius:12px}.msg{background:#f1f5f9;padding:10px;border-radius:10px;margin:8px 0}.msg.mine{background:#dbeafe}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:600px){.wrap{padding:12px}.bar .btn{padding:9px}.logo{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:135px}.info{padding:10px}.price{font-size:16px}.item h3{font-size:13px}.search{margin:14px 0}}
</style></head><body><header><div class="wrap bar"><div class="logo" onclick="reset()">Bozor.tj</div><button class="btn alt" onclick="showFavorites()">♡ Избранное</button><button class="btn alt" onclick="showInbox()">💬 Чаты</button><button class="btn alt" id="account" onclick="showAccount()">Войти</button><button class="btn" onclick="openPost()">+ Объявление</button></div></header><main class="wrap"><h1>Объявления Таджикистана</h1><div class="search"><input id="query" placeholder="Что вы ищете?" oninput="render()"><select id="city" onchange="render()"><option value="">Все города</option><option>Душанбе</option><option>Худжанд</option><option>Бохтар</option><option>Куляб</option><option>Истаравшан</option><option>Другой город</option></select></div><div id="categories" class="filters"></div><div class="row"><h2 id="heading">Свежие объявления</h2><button class="btn alt" onclick="myListings()">Мои объявления</button></div><div id="cards" class="grid"></div></main><div id="overlay"></div><script>
const cats=['Все','Телефоны','Автомобили','Недвижимость','Электроника','Мебель','Одежда','Работа','Услуги','Другое'];const emojis={'Телефоны':'📱','Автомобили':'🚗','Недвижимость':'🏠','Электроника':'💻','Мебель':'🛋️','Одежда':'👕','Работа':'💼','Услуги':'🛠️','Другое':'📦'};let user=null,items=[],active='Все',mode='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('ru-RU')+' сомони';
async function api(url,options={}){let r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}const json=(method,data)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
function modal(html){$('overlay').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button>${html}</div></div>`}function closeModal(){$('overlay').innerHTML=''}function alertErr(e){alert(e.message||e)}
async function refresh(){try{user=(await api('/api/me')).user;$('account').textContent=user?'👤 '+user.username:'Войти';await render()}catch(e){alertErr(e)}}
function renderCats(){$('categories').innerHTML=cats.map(c=>`<button class="chip ${active===c?'on':''}" onclick="chooseCat('${c}')">${c}</button>`).join('')}function chooseCat(c){active=c;mode='all';render()}function reset(){active='Все';mode='all';$('query').value='';$('city').value='';render()}function showFavorites(){mode='favorites';render()}function myListings(){if(!user)return showAccount();mode='mine';render()}
async function render(){renderCats();let p=new URLSearchParams();if($('query').value.trim())p.set('q',$('query').value.trim());if($('city').value)p.set('city',$('city').value);if(active!=='Все')p.set('category',active);if(mode==='mine')p.set('mine','1');if(mode==='favorites')p.set('favorites','1');$('heading').textContent=mode==='mine'?'Мои объявления':mode==='favorites'?'Избранное':'Свежие объявления';try{items=(await api('/api/listings?'+p)).items;$('cards').innerHTML=items.map(x=>`<article class="item" onclick="openListing(${x.id})"><div class="photo">${x.photo?`<img src="${esc(x.photo)}" alt="">`:emojis[x.category]||'📦'}</div><div class="info"><div class="row"><span class="price">${money(x.price)}</span><button class="heart" onclick="event.stopPropagation();toggleFav(${x.id})">${x.favorite?'♥':'♡'}</button></div><h3>${esc(x.title)}</h3><div class="muted">📍 ${esc(x.city)}</div></div></article>`).join('')||'<div class="empty">Объявлений пока нет. Добавьте первое!</div>'}catch(e){$('cards').innerHTML='<p>Не удалось загрузить объявления</p>'}}
function showAccount(){if(user)return modal(`<h2>Личный кабинет</h2><p>Вы вошли как <b>${esc(user.username)}</b></p><div class="actions"><button class="btn" onclick="closeModal();myListings()">Мои объявления</button><button class="btn danger" onclick="logout()">Выйти</button></div>`);modal(`<h2>Вход / Регистрация</h2><form onsubmit="auth(event)"><input name="username" required minlength="3" maxlength="40" placeholder="Имя пользователя"><input name="password" type="password" required minlength="8" placeholder="Пароль (минимум 8 символов)"><div class="actions"><button class="btn" name="action" value="login">Войти</button><button class="btn alt" name="action" value="register">Зарегистрироваться</button></div></form>`)}
async function auth(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let action=e.submitter?.value||'login';try{await api('/api/'+action,json('POST',d));closeModal();await refresh()}catch(e){alertErr(e)}}async function logout(){await api('/api/logout',{method:'POST'});closeModal();await refresh()}
function openPost(){if(!user)return showAccount();modal(`<h2>Подать объявление</h2><form onsubmit="submitPost(event)"><input name="title" required maxlength="100" placeholder="Название товара"><select name="category">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><input name="price" type="number" min="0" max="999999999" required placeholder="Цена в сомони"><select name="city">${['Душанбе','Худжанд','Бохтар','Куляб','Истаравшан','Другой город'].map(c=>`<option>${c}</option>`).join('')}</select><textarea name="description" required minlength="5" maxlength="3000" placeholder="Описание"></textarea><label>Фото (до 5 МБ)<input name="photo" type="file" accept="image/*"></label><button class="btn">Опубликовать</button></form>`)}
async function submitPost(e){e.preventDefault();try{let d=await api('/api/listings',{method:'POST',body:new FormData(e.target)});closeModal();reset();await render();openListing(d.id)}catch(e){alertErr(e)}}
async function openListing(id){try{let x=items.find(x=>x.id===id);if(!x){x=(await api('/api/listings')).items.find(x=>x.id===id)}if(!x)return alert('Объявление не найдено');modal(`<h2>${esc(x.title)}</h2>${x.photo?`<img class="bigphoto" src="${esc(x.photo)}">`:`<div class="photo">${emojis[x.category]||'📦'}</div>`}<h2>${money(x.price)}</h2><p>📍 ${esc(x.city)} · ${esc(x.category)}</p><p style="white-space:pre-wrap">${esc(x.description)}</p><p class="muted">Продавец: ${esc(x.seller)}</p><div class="actions"><button class="btn" onclick="openChat(${x.id},${x.owner_id})">💬 Написать</button><button class="btn alt" onclick="toggleFav(${x.id});openListing(${x.id})">♡ Избранное</button>${user?.id===x.owner_id?`<button class="btn danger" onclick="removeListing(${x.id})">Удалить</button>`:''}</div>`)}catch(e){alertErr(e)}}
async function toggleFav(id){if(!user)return showAccount();try{await api('/api/favorites/'+id,{method:'POST'});await render()}catch(e){alertErr(e)}}async function removeListing(id){if(!confirm('Удалить объявление?'))return;try{await api('/api/listings/'+id,{method:'DELETE'});closeModal();render()}catch(e){alertErr(e)}}
async function openChat(id,partner){if(!user)return showAccount();if(partner===user.id)return alert('Это ваше объявление. Откройте «Чаты» для ответа покупателям.');try{let d=await api('/api/messages/'+id+(partner?'?partner='+partner:''));let title=items.find(x=>x.id===id)?.title||'Переписка';modal(`<h2>💬 ${esc(title)}</h2><div style="max-height:320px;overflow:auto">${d.items.map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}"><b>${esc(m.sender)}</b><p>${esc(m.body)}</p></div>`).join('')||'<p class="muted">Начните переписку</p>'}</div><form onsubmit="sendMessage(event,${id},${d.partner})"><textarea name="body" maxlength="1000" required placeholder="Ваше сообщение"></textarea><button class="btn">Отправить</button></form>`)}catch(e){alertErr(e)}}async function sendMessage(e,id,partner){e.preventDefault();try{await api('/api/messages/'+id,json('POST',{body:e.target.elements.namedItem('body').value,partner}));openChat(id,partner)}catch(e){alertErr(e)}}
async function showInbox(){if(!user)return showAccount();try{let d=await api('/api/conversations');modal(`<h2>Мои чаты</h2>${d.items.map(x=>`<div class="msg"><b>${esc(x.title)}</b><p>Собеседник: ${esc(x.partner)}</p><button class="btn alt" onclick="openChat(${x.listing_id},${x.partner_id})">Открыть переписку</button></div>`).join('')||'<p class="muted">Сообщений пока нет</p>'}`)}catch(e){alertErr(e)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});refresh();
</script></body></html>
